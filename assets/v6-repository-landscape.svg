<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-label="Repository landscape: 14 live public repositories, 1 private at last audit; at least 15 total.">
<title>Repository Landscape: automatically refreshed counts and October 2026 category audit</title>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#141c28"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1"><stop stop-color="#5dd7c4"/><stop offset=".5" stop-color="#7ebaf0"/><stop offset="1" stop-color="#e8b67a"/></linearGradient>
</defs>
<rect x="1" y="1" width="1098" height="408" rx="18" fill="url(#base)" stroke="#31495c" stroke-width="1.6"/>
<path d="M30 60H1070" stroke="#2c4354" stroke-width="1"/>
<text x="32" y="37" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#eaf2f7">Repository Landscape</text>
<text x="1068" y="36" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="1.3" fill="#9ab5c4">COUNTS UPDATED 2026-10-30</text>

<g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="32" y="78" width="330" height="107" rx="14" fill="#0d1d28" stroke="#386c69"/>
  <text x="197" y="132" fill="#65ddc9" font-size="43" font-weight="700">15+</text>
  <text x="197" y="162" fill="#cfdfeb" font-size="16">TOTAL (AT LEAST)</text>
  <rect x="384" y="78" width="330" height="107" rx="14" fill="#0e1e2c" stroke="#365a7c"/>
  <text x="549" y="132" fill="#84bff0" font-size="43" font-weight="700">14</text>
  <text x="549" y="162" fill="#cfdfeb" font-size="16">PUBLIC REPOSITORIES</text>
  <rect x="736" y="78" width="332" height="107" rx="14" fill="#201e20" stroke="#78624b"/>
  <text x="902" y="132" fill="#e9ba80" font-size="43" font-weight="700">01</text>
  <text x="902" y="162" fill="#cfdfeb" font-size="16">PRIVATE (LAST AUDIT)</text>
</g>

<text x="32" y="225" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#eff3f7">Oct 2026 Public Repository Mix (12 Repos)</text>
<text x="1068" y="224" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#91aebe">Count of repos, not code-size percentages</text>
<clipPath id="rounded"><rect x="32" y="242" width="1036" height="29" rx="12"/></clipPath>
<g clip-path="url(#rounded)">
  <rect x="32" y="242" width="518" height="29" fill="#59d5c0"/>
  <rect x="550" y="242" width="259" height="29" fill="#7ebaf0"/>
  <rect x="809" y="242" width="87" height="29" fill="#e8b67a"/>
  <rect x="896" y="242" width="172" height="29" fill="#63778e"/>
</g>
<rect x="32" y="242" width="1036" height="29" rx="12" fill="none" stroke="#a5b7c5" stroke-opacity=".16"/>
<path d="M36 278H1064" stroke="url(#flow)" stroke-width="1.2" stroke-dasharray="14 15" opacity=".65">
<animate attributeName="stroke-dashoffset" from="0" to="-116" dur="17s" repeatCount="indefinite"/>
</path>

<g font-family="Arial,sans-serif" font-size="16" fill="#d8e5ee">
<circle cx="41" cy="309" r="6" fill="#59d5c0"/><text x="60" y="315"><tspan font-weight="700">6</tspan>  Python notebook / research projects</text>
<circle cx="565" cy="309" r="6" fill="#7ebaf0"/><text x="584" y="315"><tspan font-weight="700">3</tspan>  JavaScript-primary projects</text>
<circle cx="41" cy="342" r="6" fill="#e8b67a"/><text x="60" y="348"><tspan font-weight="700">1</tspan>  RouterOS Script / network lab</text>
<circle cx="565" cy="342" r="6" fill="#63778e"/><text x="584" y="348"><tspan font-weight="700">2</tspan>  Profile / supporting repositories</text>
</g>
<path d="M32 366H1068" stroke="#2e4455"/>
<text x="34" y="388" font-family="Arial,sans-serif" font-size="13" fill="#a7bfc9">Category mix is an Oct 2026 snapshot; totals above refresh through GitHub Actions.</text>
</svg>