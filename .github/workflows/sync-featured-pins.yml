name: Sync Featured Projects With GitHub Pins

on:
  workflow_dispatch:
  schedule:
    # Pin changes have no native GitHub Actions event; poll every 30 minutes.
    - cron: "17,47 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-featured-pins.yml"
      - "scripts/sync_featured_pins.py"

permissions:
  contents: write

concurrency:
  group: profile-featured-pins
  cancel-in-progress: false

jobs:
  sync-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Render pinned repository cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_featured_pins.py

      - name: Commit changed featured cards
        run: |
          if git diff --quiet -- README.md assets/pinned-*.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/pinned-*.svg
          git commit -m "chore: synchronize featured cards with profile pins"
          git push
