name: Refresh Contribution Motion

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-motion.yml"

permissions:
  contents: write

jobs:
  contribution-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-motion.svg?palette=github-dark&color_snake=#59d5c0&color_dots=#111c2a,#1e4143,#307566,#46a58f,#7bd8b9

      - name: Publish SVG to a separate output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
